[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# Vennlige URL-er
[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200
  force = true

[[redirects]]
  from = "/finn.ics"
  to = "/.netlify/functions/finn-ical"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
